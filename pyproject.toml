[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "INFO"

[tool.coverage.run]
source = ["agent", "channels", "workers", "api", "database"]
omit = ["tests/*", "database/migrations/*", "database/seed_kb.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
