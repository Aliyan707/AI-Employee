# Three separate Deployments for the three worker types.
# Each runs the same Docker image with a different CMD.

---
# Intake Worker: consumes cs.intake, runs pipeline
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-intake-worker
  namespace: cs-fte
  labels:
    app: cs-fte
    component: intake-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cs-fte
      component: intake-worker
  template:
    metadata:
      labels:
        app: cs-fte
        component: intake-worker
    spec:
      containers:
        - name: cs-intake-worker
          image: cs-fte:api
          command: ["python", "-m", "workers.intake_worker"]
          envFrom:
            - configMapRef:
                name: cs-fte-config
            - secretRef:
                name: cs-fte-secrets
          resources:
            requests:
              cpu: "125m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

