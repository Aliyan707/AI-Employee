apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-api
  namespace: cs-fte
  labels:
    app: cs-fte
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cs-fte
      component: api
  template:
    metadata:
      labels:
        app: cs-fte
        component: api
    spec:
      containers:
        - name: cs-api
          image: cs-fte:api
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: cs-fte-config
            - secretRef:
                name: cs-fte-secrets
          command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
