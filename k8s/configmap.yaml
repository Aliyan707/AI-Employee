apiVersion: v1
kind: ConfigMap
metadata:
  name: cs-fte-config
  namespace: cs-fte
  labels:
    app: cs-fte
data:
  # Application environment
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  DAILY_REPORT_HOUR: "7"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  # PostgreSQL (host/port/db only — credentials in secret)
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "cs_fte"
  POSTGRES_USER: "cs_fte_user"

  # Frontend API URL
  NEXT_PUBLIC_API_URL: "http://cs-api-service"
